<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Enchant Brand Histories — settings</title>
    <style>
      body {
        max-width: 360px;
        margin: 48px auto;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 14px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #666;
        margin: 10px 0 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 9px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 13px;
      }
      button {
        margin-top: 14px;
        width: 100%;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #1d4ed8;
        background: #1d4ed8;
        color: #fff;
        font-size: 13px;
        cursor: pointer;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #0f9d58;
      }
      #status.error {
        color: #c0392b;
      }
    </style>
  </head>
  <body>
    <h1>Enchant Brand Histories</h1>
    <label for="appUrl">App URL</label>
    <input id="appUrl" type="text" placeholder="https://your-app.onrender.com" />
    <label for="apiToken">API token</label>
    <input id="apiToken" type="password" placeholder="Paste token from the app" />
    <button id="save">Save</button>
    <div id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
